<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0a0c0f">
    <title>Sign in — UrlShortener</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233ee6b0'/%3E%3Cpath d='M13 19l6-6M14.5 11.5l1.2-1.2a3.5 3.5 0 015 5l-1.2 1.2M17.5 20.5l-1.2 1.2a3.5 3.5 0 01-5-5l1.2-1.2' stroke='%2304211a' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
    <script src="/main.js"></script>
    <script src="/ui.js"></script>
</head>
<body data-page="login">
<header id="nav"></header>

<main class="auth-wrap">
    <div class="card auth-card">
        <div class="auth-head">
            <div class="brand-mark"><span data-icon="link"></span></div>
            <h1>Welcome back</h1>
            <p>Sign in to manage your short links.</p>
        </div>

        <form id="login-form" novalidate>
            <div class="field">
                <label class="label" for="input-name">Name</label>
                <input id="input-name" class="input" autocomplete="username" autocapitalize="none"
                       spellcheck="false" placeholder="Your name" required autofocus>
            </div>

            <div class="field">
                <label class="label" for="input-password">Password</label>
                <div class="input-group">
                    <input id="input-password" class="input" type="password"
                           autocomplete="current-password" placeholder="••••••••" required>
                    <button type="button" class="icon-btn" data-toggle-password="input-password"
                            aria-label="Show password"></button>
                </div>
            </div>

            <div class="form-actions">
                <button id="login-button" class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
            </div>
        </form>

        <p class="auth-foot">New here? <a href="/register.html">Create an account</a></p>
    </div>
</main>

<script>
    if (JwtAuth.isAuthenticated()) {
        window.location.replace("/");
    }

    const form = document.getElementById("login-form");
    const inputName = document.getElementById("input-name");
    const inputPassword = document.getElementById("input-password");
    const loginButton = document.getElementById("login-button");

    inputName.addEventListener("input", () => inputName.classList.remove("invalid"));
    inputPassword.addEventListener("input", () => inputPassword.closest(".input-group").classList.remove("invalid"));

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = inputName.value.trim();
        const password = inputPassword.value;

        if (!name || !password) {
            (!name ? inputName : inputPassword).focus();
            if (!name) inputName.classList.add("invalid");
            if (!password) inputPassword.closest(".input-group").classList.add("invalid");
            UI.toast("Enter your name and password.", "error");
            return;
        }

        try {
            await UI.busy(loginButton, () => JwtAuth.login(name, password));
            window.location.href = "/";
        } catch (err) {
            // main.js throws Error("Login failed") when the API answers 404 with an empty body
            // (unknown name / wrong password), and a TypeError when the server is unreachable.
            let message;
            if (err instanceof TypeError) {
                message = "Can't reach the server. Check your connection and try again.";
            } else if (!err || !err.message || /^login failed$|not found/i.test(err.message)) {
                message = "Invalid name or password.";
            } else {
                message = err.message;
            }
            UI.toast(message, "error");
            inputPassword.select();
        }
    });
</script>
</body>
</html>
